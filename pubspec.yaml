name: movies_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  flutter_svg: ^2.0.17
  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.8
  introduction_screen: ^4.0.0
  flutter_native_splash: ^2.4.8

  firebase_core: ^4.14.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.9.0
  google_sign_in: ^6.2.1

  flutter_bloc: ^9.1.1
  dio: ^5.11.0
  carousel_slider: ^5.1.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
